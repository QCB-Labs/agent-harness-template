name: CI

on:
  # Code changes only: pushes that add session logs and memory don't run the suite.
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "tests/**"
      - "config/**"
      - "naming/**"
      - "naming.json"
      - "fixtures/**"
      - "hooks/**"
      - ".agents/**"
      - "AGENTS.md"
      - "STANDING-ORDERS.md"
      - "agent-profile.json"
      - "pytest.ini"
      - "requirements-mcp.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "tools/**"
      - "tests/**"
      - "config/**"
      - "naming/**"
      - "naming.json"
      - "fixtures/**"
      - "hooks/**"
      - ".agents/**"
      - "AGENTS.md"
      - "STANDING-ORDERS.md"
      - "agent-profile.json"
      - "pytest.ini"
      - "requirements-mcp.txt"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-mcp.txt

      - name: Run tests
        run: pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
